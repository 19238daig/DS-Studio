name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Run backend regression
        # Database-integration suites need a prepared PostgreSQL + Olist data;
        # the streaming HTTP suite is timing-sensitive on shared runners.
        run: >
          python -m pytest tests/ -q --tb=short
          --ignore=tests/test_database_integration.py
          --ignore=tests/test_database_phase_a_verify.py
          --deselect tests/test_task_stream.py::test_real_http_first_event_heartbeat_disconnect_and_resume_do_not_restart_job

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
